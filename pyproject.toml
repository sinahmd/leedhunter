[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "leedhunter"
version = "0.1.0"
description = "AI-powered prospect research engine"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "LeedHunter Team" }
]

dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.12.0",
    "asyncpg>=0.29.0",
    "redis>=5.0.0",
    "httpx>=0.25.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "mypy>=1.7.0",
    "ruff>=0.1.0",
]
llm-anthropic = [
    "anthropic>=0.18.0",
]
llm-openai = [
    "openai>=1.0.0",
]
llm-google = [
    "google-generativeai>=0.3.0",
]
llm-all = [
    "leedhunter[llm-anthropic,llm-openai,llm-google]",
]

[project.scripts]
leedhunter = "leedhunter.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/leedhunter"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B904",  # raise from (too strict for now)
    "SIM102", # nested if (readability preference)
    "B007",  # unused loop variable (common pattern)
    "B017",  # broad exception assertion (acceptable in tests)
    "SIM103", # return bool directly (readability)
    "SIM108", # ternary operator (readability)
    "F841",  # unused variable (false positives)
]

[tool.ruff.lint.per-file-ignores]
"src/leedhunter/cli/doctor.py" = ["F401"]  # Imports used for availability checks
"tests/**" = ["F811", "F401"]  # Test imports and fixtures
